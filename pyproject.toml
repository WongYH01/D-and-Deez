[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "d-and-deez"
version = "0.0.0"
description = "D and Deez: single-player, text-based D&D 5e web app."
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "sqlalchemy>=2.0", "alembic", "anthropic", "fastembed", "sqlite-vec", "pypdf"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
d-and-deez-play = "d_and_deez.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["d_and_deez*"]  # never package the web UI in src/web

[tool.setuptools.package-data]
d_and_deez = ["data/*.json", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# An SAWarning often means a row silently was not saved (e.g. SQLAlchemy 2 no longer cascades through backrefs).
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
